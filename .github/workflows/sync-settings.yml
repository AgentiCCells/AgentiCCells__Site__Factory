name: Sync site settings
# Manual. For every live factory site: set the About box's website to https://<domain>
# and give the owner's teams their role (build/access.mjs). Changes nothing else and
# writes nothing to this repository. The table is in the run's summary.
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  sync:
    if: github.ref == 'refs/heads/dev'  # manual runs from other branches never reach the environment's secrets
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run.mjs
      - name: GitHub App token (about an hour)
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: AgentiCCells
      - name: GitHub App token for PrompTugal (if the App is installed there)
        id: app_pt
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: PrompTugal
      - name: Sync every live site
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN_PROMPTUGAL: ${{ steps.app_pt.outputs.token }}
        run: node build/sync-settings.mjs

name: Plan
# Plan on the pull request. No secrets, no cloud access, nothing is created.
# Job 1 runs repository code with a read-only token. Job 2 holds the only write
# permission and runs none of the pull request's code: it posts text from job 1.
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  # Control 9: the signature and leak checks run in their own job, which runs no code from the pull
  # request. It checks the tree out as data, takes each checker from the base commit (dev's tip) and
  # checks BEFORE..head, BEFORE being the merge-base with dev, with a clean environment.
  trusted-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GIT_NO_REPLACE_OBJECTS: "1"
      NODE_OPTIONS: ""
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take the trusted checkers from the base commit
        run: |
          set -euo pipefail
          BEFORE=$(git merge-base "$BASE" "$HEAD_SHA")
          echo "BEFORE=$BEFORE" >> "$GITHUB_ENV"
          # Refuse symlinks on the checker paths, in BEFORE's tree and in the checkout.
          # The checkers' code comes from the base commit (dev's tip, already merged), never the PR head.
          for f in build/check-signatures.mjs build/leak-scan.mjs; do
            mode=$(git ls-tree "$BASE" -- "$f" | cut -d' ' -f1)
            if [ "$mode" != "100644" ] && [ "$mode" != "100755" ]; then echo "refused: $f in the base is not a plain file ($mode)"; exit 1; fi
          done
          if [ -L build ] || [ -e build/.trusted-leak-scan.mjs ] || [ -L build/.trusted-leak-scan.mjs ]; then echo "refused: build/ is a symlink or the trusted path exists"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "$BASE:build/check-signatures.mjs" > "$RUNNER_TEMP/trusted/check-signatures.mjs"
          git show "$BASE:build/leak-scan.mjs" > build/.trusted-leak-scan.mjs
          # Control 10: the symlink check, also from the base. Until it is merged it is not in the base,
          # and the pull request that adds it is reviewed by Dinis (as for the signature check).
          mode=$(git ls-tree "$BASE" -- build/check-symlinks.mjs | cut -d' ' -f1)
          if [ -n "$mode" ]; then
            if [ "$mode" != "100644" ]; then echo "refused: build/check-symlinks.mjs in the base is not a plain file ($mode)"; exit 1; fi
            git show "$BASE:build/check-symlinks.mjs" > "$RUNNER_TEMP/trusted/check-symlinks.mjs"
          fi
          echo "NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - name: Every new commit is signed by its agent's published key and names its session
        run: '"$NODE_BIN" "$RUNNER_TEMP/trusted/check-signatures.mjs" "$BEFORE" "$HEAD_SHA"'
      - name: No symlinks in any commit of the range or in the tree (control 10; exceptions from the base only)
        run: |
          if [ -f "$RUNNER_TEMP/trusted/check-symlinks.mjs" ]; then "$NODE_BIN" "$RUNNER_TEMP/trusted/check-symlinks.mjs" "$BASE" "$BEFORE" "$HEAD_SHA" --tree .
          else echo "check-symlinks.mjs is not in the base yet: this pull request adds it"; fi
      - name: Leak scan (BEFORE's copy; it finds the repository root from its own location)
        run: '"$NODE_BIN" build/.trusted-leak-scan.mjs'
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node test/run.mjs
      - name: Validate every request
        run: node build/validate.mjs
      - name: Plan the changed requests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          folders=$(git diff --name-only "$BASE" HEAD -- requests | cut -d/ -f1-2 | sort -u | grep -v '^requests/EXAMPLE$' | grep -v '^requests/README.md$' | while read -r d; do [ -d "$d" ] && echo "$d"; done || true)
          mkdir -p out
          set +e
          # shellcheck disable=SC2086
          node build/plan.mjs $folders > out/plan.md
          echo $? > out/exit
          cat out/plan.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: out
      - name: Fail the check if a request is invalid
        run: test "$(cat out/exit)" = "0"
  comment:
    needs: plan
    if: ${{ always() && needs.plan.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: out
      - name: Refuse symlinks in the downloaded artifact (control 10)
        run: |
          if [ -n "$(find out -type l -print -quit)" ]; then find out -type l; echo "refused: the plan artifact holds a symlink"; exit 1; fi
      - name: Post or update the plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- site-factory-plan -->';
            const body = marker + '\n' + fs.readFileSync('out/plan.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

name: Plan
# Plan on the pull request. No secrets, no cloud access, nothing is created.
# Job 1 runs repository code with a read-only token. Job 2 holds the only write
# permission and runs none of the pull request's code: it posts text from job 1.
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node test/run.mjs
      - name: Validate every request
        run: node build/validate.mjs
      - name: Leak scan
        run: node build/leak-scan.mjs
      - name: Every new commit is signed by its agent's published key and names its session
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Run the checker from the base branch's copy, never the pull request's own,
        # so a pull request cannot change the check that judges it (control 7).
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "$BASE:build/check-signatures.mjs" > "$RUNNER_TEMP/trusted/check-signatures.mjs"
          node "$RUNNER_TEMP/trusted/check-signatures.mjs" "$BASE" "$HEAD_SHA"
      - name: Plan the changed requests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          folders=$(git diff --name-only "$BASE" HEAD -- requests | cut -d/ -f1-2 | sort -u | grep -v '^requests/EXAMPLE$' | grep -v '^requests/README.md$' | while read -r d; do [ -d "$d" ] && echo "$d"; done || true)
          mkdir -p out
          set +e
          # shellcheck disable=SC2086
          node build/plan.mjs $folders > out/plan.md
          echo $? > out/exit
          cat out/plan.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: out
      - name: Fail the check if a request is invalid
        run: test "$(cat out/exit)" = "0"
  comment:
    needs: plan
    if: ${{ always() && needs.plan.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: out
      - name: Post or update the plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- site-factory-plan -->';
            const body = marker + '\n' + fs.readFileSync('out/plan.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
